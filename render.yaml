services:
  # ─── Backend (FastAPI) ────────────────────────────────────────────────────
  - type: web
    name: savollar-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_USERNAME
        value: admin123
      - key: ADMIN_PASSWORD
        value: Admin#2026!
      - key: DATABASE_URL
        fromDatabase:
          name: savollar-db
          property: connectionString

  # ─── Frontend (React / Vite static site) ─────────────────────────────────
  - type: web
    name: savollar-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://savollar-backend.onrender.com
      - key: VITE_ADMIN_USERNAME
        value: admin123
      - key: VITE_ADMIN_PASSWORD
        value: Admin#2026!
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  - name: savollar-db
    databaseName: savollar
    user: savollar_user
    plan: free
