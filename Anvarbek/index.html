<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Foydalanuvchilar</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <div class="loding" id="loading">
    <p class="lading_title">⏳ Yuklanmoqda...</p>
  </div>

  <div id="container"></div>

  <script>
    const container = document.getElementById('container');
    const loading = document.getElementById('loading');

    async function fetchUsers() {
      try {
        const response = await fetch('https://dummyjson.com/users?limit=30');
        const data = await response.json();
        loading.style.display = 'none';
        renderUsers(data.users);
      } catch (error) {
        loading.innerHTML = '<p class="lading_title">❌ Xatolik yuz berdi!</p>';
        console.error('Xatolik:', error);
      }
    }

    function renderUsers(users) {
      users.forEach((user, index) => {
        const card = document.createElement('div');
        card.className = 'card';

        // Haqiqiy inson rasmlari
        const photoUrl = `https://i.pravatar.cc/150?img=${index + 1}`;

        card.innerHTML = `
          <img 
            class="avatar" 
            src="${photoUrl}" 
            alt="${user.firstName} ${user.lastName}"
            onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.firstName + ' ' + user.lastName)}&background=4f46e5&color=fff&size=150&bold=true'"
          />
          <p class="user-name">${user.firstName} ${user.lastName}</p>
          <p class="user-age">Yosh: ${user.age}</p>
          <p class="user-email">${user.email}</p>
        `;

        container.appendChild(card);
      });
    }

    fetchUsers();
  </script>

</body>
</html>
